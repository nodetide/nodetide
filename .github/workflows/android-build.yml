name: Build Android App

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Release App Bundle (what Google Play takes)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Check 16 KB page-size support of the native libraries (Google Play requirement)
        run: |
          python3 android/tools/check_16k.py android/app/build/outputs/apk/release/*.apk
          python3 android/tools/check_16k.py android/app/build/outputs/bundle/release/*.aab

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: nodetide-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: nodetide-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: nodetide-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
