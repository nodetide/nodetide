name: Release Android App

# Signed bundle for Google Play, from a tag like android-v0.2.0 (or by hand). The upload key lives only in the
# "production" environment (required reviewer, tags only): set it up once with android/tools/setup-release.sh.
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to (when uploading is on)
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # to attach the bundle to the GitHub release

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4

      - name: Tests first
        working-directory: android
        run: ./gradlew :protocol:test :app:testDebugUnitTest --no-daemon

      - name: Put the upload keystore on the runner
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "UPLOAD_KEYSTORE_BASE64 is not set: run android/tools/setup-release.sh"; exit 1; }
          umask 077
          printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build the signed bundle
        working-directory: android
        env:
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ vars.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then export VERSION_NAME="${REF_NAME#android-v}"; fi
          ./gradlew bundleRelease --no-daemon

      - name: Check it is signed by the expected upload key
        env:
          STORE_PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          EXPECTED: ${{ vars.UPLOAD_CERT_SHA256 }}
        run: |
          aab=$(ls android/app/build/outputs/bundle/release/*.aab)
          jarsigner -verify "$aab" >/dev/null
          actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: *//p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "signed with certificate SHA-256 $actual"
          if [ -n "$EXPECTED" ] && [ "$actual" != "$EXPECTED" ]; then echo "::error::not the registered upload key ($EXPECTED)"; exit 1; fi

      - name: Check 16 KB page-size support of the native libraries
        run: python3 android/tools/check_16k.py android/app/build/outputs/bundle/release/*.aab

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: nodetide-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/bundle/release/*.aab --clobber

      # Off until the app exists in the Play Console and has had its first release by hand:
      #   gh variable set PLAY_UPLOAD --body true;  gh secret set PLAY_SERVICE_ACCOUNT_JSON --env production < key.json
      # The status stays "draft" (you press Publish in the Console) until PLAY_RELEASE_STATUS is set to "completed".
      - name: Upload to Google Play
        if: vars.PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: eu.kuklin.nodetide
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
